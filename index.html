<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio | Revista WEB</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="contenedor">
    <!-- DASHBOARD DE BIENVENIDA -->
    <section class="dashboard" id="dashboard">
      <div class="perfil-box">
        <img src="image/perfil.png" alt="Foto de presentación" class="foto-perfil" />
        <div>
          <strong>ANDREA ALEJANDRA CHANG MEJÍA</strong>
          <p style="margin: 0; font-size: 0.9rem;">Estudiante de P.P.S.</p>
        </div>
      </div>

      <div class="info-box">
        <h1>REVISTA DE INVENTARIO FORESTAL CERRO XINIJ</h1>
        <p>
          Aldea San Isidro Chamac, San Pedro Sacatepequez, San Marcos.
        </p>

        <div class="trabajos-grid">
          <div class="trabajo-item">
            <strong>Proyectos realizados</strong>
            <span>Servicio de P.P.S.</span>
          </div>
          <div class="trabajo-item">
            <strong>Resumen de revista</strong>
            <span>Situacion actual, utilidad, pasos resultados.</span>
          </div>
        </div>

        <button type="button" class="btn" id="btnVerRevista">
          Ver revista →
        </button>
      </div>
    </section>

    <!-- VISTA DE LA REVISTA -->
    <section class="seccion-revista" id="seccionRevista">
      <div class="barra-superior">
        <button type="button" class="btn btn-secundario" id="btnVolver">
          ← Volver al inicio
        </button>
        <span id="numPagina">Página 1</span>
      </div>

      <div class="visor-wrap">
        <div id="revista">
          <div class="pagina"><img src="image/1.jpg" alt="Página 1" /></div>
          <div class="pagina"><img src="image/2.jpg" alt="Página 2" /></div>
          <div class="pagina"><img src="image/3.jpg" alt="Página 3" /></div>
          <div class="pagina"><img src="image/4.jpg" alt="Página 4" /></div>
          <div class="pagina"><img src="image/5.jpg" alt="Página 5" /></div>
          <div class="pagina"><img src="image/6.jpg" alt="Página 6" /></div>
          <div class="pagina"><img src="image/7.jpg" alt="Página 7" /></div>
          <div class="pagina"><img src="image/8.jpg" alt="Página 8" /></div>
          <div class="pagina"><img src="image/9.jpg" alt="Página 9" /></div>
          <div class="pagina"><img src="image/10.jpg" alt="Página 10" /></div>
          <div class="pagina"><img src="image/11.jpg" alt="Página 11" /></div>
          <div class="pagina"><img src="image/12.jpg" alt="Página 12" /></div>
          <div class="pagina"><img src="image/13.jpg" alt="Página 13" /></div>
          <div class="pagina"><img src="image/14.jpg" alt="Página 14" /></div>
          <div class="pagina"><img src="image/15.jpg" alt="Página 15" /></div>
          <div class="pagina"><img src="image/16.jpg" alt="Página 16" /></div>
        </div>
      </div>

      <div class="controles">
        <button type="button" class="btn btn-secundario" id="btnPrev">← Anterior</button>
        <button type="button" class="btn btn-secundario" id="btnNext">Siguiente →</button>
      </div>
    </section>
  </div>

  <audio id="musica" src="music/fondo.mp3" loop></audio>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
